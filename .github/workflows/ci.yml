name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # Prisma Client is generated code and is not committed, so nothing type-checks
      # until this runs.
      - run: npx prisma generate

      # `next build` type-checks as part of the build (Turbopack), so this single
      # step covers both. A standalone `tsc --noEmit` cannot run first: Next
      # rewrites next-env.d.ts to reference .next/types/routes.d.ts, which does not
      # exist until a build has happened.
      # Verified: the build needs no DATABASE_URL/DIRECT_URL/AUTH_SECRET. Nothing
      # connects to the database at build time, and `prisma generate` (unlike
      # `prisma validate`) does not resolve env vars.
      - name: Build
        run: npm run build

  migrations:
    name: Migrations match schema.prisma
    runs-on: ubuntu-latest
    # The migration history once drifted 28 tables behind schema.prisma, because
    # work was applied with `prisma db push` (which records nothing) instead of
    # `prisma migrate dev`. It was invisible locally — the dev database already
    # matched — and only surfaced when a fresh deploy built 50 tables while the
    # generated client expected 78. This job makes that impossible to merge:
    # it replays prisma/migrations into an empty database and fails if the result
    # differs from schema.prisma.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: becs
          POSTGRES_PASSWORD: becs
          POSTGRES_DB: shadow
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci

      # --exit-code makes a non-empty diff a non-zero exit, so this is the gate.
      # The shadow database is the throwaway service container above; DIRECT_URL
      # must be set because the datasource declares directUrl and Prisma fails
      # validation without it.
      - name: Diff migrations against schema.prisma
        env:
          DATABASE_URL: postgresql://becs:becs@localhost:5432/shadow
          DIRECT_URL: postgresql://becs:becs@localhost:5432/shadow
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$DATABASE_URL" \
            --exit-code \
            --script

  lint:
    name: Lint (non-blocking)
    runs-on: ubuntu-latest
    # NOTE: `main` already carries 7 pre-existing eslint errors (react-hooks
    # set-state-in-effect in the personnel sections, plus finance/page.tsx). This job
    # reports them without blocking deploys. Once the dev team clears them, delete
    # this line so lint becomes a real gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
